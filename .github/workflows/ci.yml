# CI — approved by Zac Harlan in chat, 2026-10-25.
# The job name "test" is what harden-github.sh requires as a status check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit + architecture tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
      - name: Guardrail self-test
        run: bash tests/guardrails/run.sh
      - name: Stale architecture baseline
        run: node tests/architecture/rules.js --stale
